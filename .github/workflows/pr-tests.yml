name: PR tests

on:
  pull_request:
  # Two PRs that are each green can still break main together (#205 + #129), so main is
  # tested after every merge too. merge_group lets a merge queue run it before the merge.
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run CI setup regression tests
        run: bash tests/ci_setup_test.sh
      - name: Install Godot 4.3 and software renderer
        run: |
          bash scripts/install_ci_renderer.sh
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v4.3-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check comparison write errors
        env:
          BEFORE_AFTER_COMPARE_TEST_OUTPUT: ${{ runner.temp }}/craterbowl-visual/before-after-comparison
        run: bash tests/before_after_compare_test.sh
      - name: Run rendered integration tests
        env:
          VISUAL_OUTPUT: ${{ runner.temp }}/craterbowl-visual
        run: ./scripts/visual_test.sh
      - name: Check before/after failure reporting
        env:
          BEFORE_AFTER_TEST_OUTPUT: ${{ runner.temp }}/craterbowl-visual/before-after-status
        run: bash tests/before_after_test.sh
      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-evidence
          path: ${{ runner.temp }}/craterbowl-visual/
          if-no-files-found: error
      - name: Run full check
        if: success() || failure()
        run: ./scripts/check.sh
